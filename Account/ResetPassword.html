<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/bootstrap.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
     <div class="auth-single-page">
        <div class="auth-single-card">
            <div class="icon-circle"><i class="fas fa-key"></i></div>
            <h2>Reset Your Password</h2>
            <p>Enter your new password to activate your account.</p>

            <div class="validation-summary"></div>

            <form action="/Account/ResetPassword" method="POST">
                <input type="hidden" name="Token" value="">
                <input type="hidden" name="Email" value="">

<div class="input-wrapper">
    <input type="password" id="NewPassword" name="NewPassword" class="form-control" placeholder=" " required>
    <label class="floating-label" for="NewPassword">New Password</label>
</div>

<div class="password-strength-meter" id="pwdStrengthMeter" style="display: none;">
   <ul class="requirements-list">
    <li id="req-length" class="req-item"><span class="req-icon"></span> 8 characters minimum</li>
    <li id="req-lower" class="req-item"><span class="req-icon"></span> One lowercase letter</li>
    <li id="req-upper" class="req-item"><span class="req-icon"></span> One uppercase letter</li>
    <li id="req-number" class="req-item"><span class="req-icon"></span> One number</li>
    <li id="req-special" class="req-item"><span class="req-icon"></span> One special character</li>
</ul>
</div>

                <div class="input-wrapper">
                    <input type="password" id="ConfirmPassword" name="ConfirmPassword" class="form-control" placeholder=" " required>
                    <label class="floating-label" for="ConfirmPassword">Confirm New Password</label>
                </div>

                <button type="submit" class="btn-primary-auth">Confirm & Reset Password</button>
            </form>

            <a href="Login.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Log In
            </a>
        </div>
    </div>

    <div id="footer" class="footer-container">Footer</div>
    <script src="../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const emailInput = document.querySelector('input[name="Email"]');
            const tokenInput = document.querySelector('input[name="Token"]');
            if (params.get('email') && emailInput) emailInput.value = params.get('email');
            if (params.get('token') && tokenInput) tokenInput.value = params.get('token');
        });
    </script>

    <script src="../js/bootstrap.bundle.js"></script>
</body>
</html>
