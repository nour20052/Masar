<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Massar</title>
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/bootstrap.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-single-page">
        <div class="auth-single-card">
            <div class="icon-circle"><i class="fas fa-lock"></i></div>
            <h2>Forgot Password?</h2>
            <p>No worries! Enter your email and we'll send you a reset link.</p>

            <div class="success-message"></div>
            <div class="validation-summary"></div>

            <form action="verifycode.html" method="GET">
                <div class="input-wrapper">
                    <input type="email" id="Email" name="Email" class="form-control" placeholder=" " required>
                    <label class="floating-label" for="Email">Email Address</label>
                </div>
                <button type="submit" class="btn-primary-auth" style="margin-bottom: 16px;">Send Reset Code</button>
            </form>

            <a href="Login.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Log In
            </a>
        </div>
    </div>

    <div id="footer" class="footer-container">Footer</div>
    <script src="../js/script.js"></script>
    <script src="../js/bootstrap.bundle.js"></script>
</body>
</html>
